server:
  http_listen_port: ${promtail_listen_port}
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://localhost:${loki_listen_port}/loki/api/v1/push

scrape_configs:
%{ if length(cloudwatch_log_groups) > 0 ~}
  - job_name: alb-access-logs

    aws_cloudwatch_logs:
      log_group_names: ${jsonencode(cloudwatch_log_groups)}
      region: ap-southeast-3
      use_incoming_timestamp: true

      pipeline_stages:
        - regex:
            expression: '^(?P<type>[^ ]+) (?P<timestamp>[^ ]+) (?P<elb>[^ ]+) (?P<client_ip>[^ ]+):(?P<client_port>[0-9]+) (?P<target_ip>[^ ]+) (?P<request_processing_time>[-.0-9]+) (?P<target_processing_time>[-.0-9]+) (?P<response_processing_time>[-.0-9]+) (?P<elb_status_code>[0-9]{3}) (?P<target_status_code>[0-9]{3}) (?P<received_bytes>[-.0-9]+) (?P<sent_bytes>[-.0-9]+) "(?P<request>.*)" "(?P<user_agent>[^"]*)" (?P<ssl_cipher>[A-Za-z0-9\-_]+) (?P<ssl_protocol>[A-Za-z0-9\._\-]+) (?P<target_group_arn>[^ ]+) "(?P<trace_id>[^"]+)" "(?P<domain_name>[^"]+)" "(?P<chosen_cert_arn>[^"]+)" (?P<matched_rule_priority>[-.0-9]+) (?P<request_creation_time>[^ ]+) "(?P<actions_executed>[^"]*)" "(?P<redirect_url>[^"]*)" "(?P<error_reason>[^"]*)" ".*" ".*" ".*" (?P<classification>[^ ]+) (?P<classification_reason>[^ ]+).*$'

        - labels:
            elb_status_code:
            target_status_code:
            http_method:

        - output:
            source: log_line

    relabel_configs:
      - source_labels:
          - __aws_cloudwatch_log_group
        target_label: log_group
%{ endif ~}
